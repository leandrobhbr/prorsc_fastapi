[project]
name = "calculadora-rsc-fastapi"
version = "1.0.0"
description = "Calculadora RSC-TAE de livre acesso — backend em FastAPI"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "bcrypt>=5.0",
    "fastapi>=0.115",
    "gunicorn>=23.0",
    "hashids>=1.3",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.35",
    "uvicorn-worker>=0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Testes "async def" rodam automaticamente no loop do asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: chamar Depends() no valor padrão do parâmetro é o padrão do FastAPI.
ignore = ["B008"]
