# Calculadora RSC-TAE (fastapi) publicada em SUBPASTA de um domínio que já existe:
#   https://exemplo.com.br/prorsc_fastapi/
#
# Não é um VirtualHost: este trecho entra DENTRO do <VirtualHost *:443> do domínio, por meio
# da linha abaixo (adicionada uma única vez no vhost):
#   IncludeOptional /etc/apache2/prorsc/*.conf
#
# Instalação:
#   sudo mkdir -p /etc/apache2/prorsc
#   sudo cp deploy/apache/prorsc-fastapi-subpasta.conf /etc/apache2/prorsc/
#   sudo a2enmod proxy proxy_http headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# No /etc/prorsc-fastapi.env: FRONT_PUBLIC_PATH=/prorsc_fastapi/ e FRONT_API_URL=/prorsc_fastapi/api/v1

# Sem a barra final, os caminhos relativos do build quebrariam: /prorsc_fastapi → /prorsc_fastapi/
RedirectMatch 301 ^/prorsc_fastapi$ /prorsc_fastapi/

# API → Gunicorn. O Apache tira o prefixo: /prorsc_fastapi/api/v1/... chega como /api/v1/...
# (ProxyPass tem prioridade sobre o Alias do frontend, mais abaixo.)
ProxyPass        /prorsc_fastapi/api/ http://127.0.0.1:8002/api/ timeout=60
ProxyPassReverse /prorsc_fastapi/api/ http://127.0.0.1:8002/api/

<Location /prorsc_fastapi/>
    # O backend recebe o domínio original no cabeçalho Host (e não 127.0.0.1).
    ProxyPreserveHost On
    # Informa ao backend que o acesso original foi por HTTPS.
    RequestHeader set X-Forwarded-Proto "https"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</Location>

# Frontend compilado (quasar build), copiado pelo deploy/atualizar.sh.
Alias /prorsc_fastapi/ /var/www/prorsc-fastapi/
<Directory /var/www/prorsc-fastapi>
    Options -Indexes
    AllowOverride None
    Require all granted
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
<Directory /var/www/prorsc-fastapi/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
