# VirtualHost do Apache para a Calculadora RSC-TAE (FastAPI).
# - "/"     → arquivos estáticos do frontend (resultado do "quasar build")
# - "/api/" → proxy reverso para o Gunicorn em 127.0.0.1:8002
#
# Instalação:
#   sudo cp deploy/apache/prorsc-fastapi.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite prorsc-fastapi && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d calculadora.exemplo.com.br   # HTTPS (cria o vhost :443)

<VirtualHost *:80>
    ServerName calculadora.exemplo.com.br

    DocumentRoot /var/www/prorsc-fastapi
    <Directory /var/www/prorsc-fastapi>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # API: o navegador fala só com o Apache; o Apache repassa para o Python.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8002/api/ timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:8002/api/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Cabeçalhos de segurança
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # index.html nunca em cache (aponta para a versão nova); assets com hash, cache longo.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    <Directory /var/www/prorsc-fastapi/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/prorsc-fastapi-error.log
    CustomLog ${APACHE_LOG_DIR}/prorsc-fastapi-access.log combined
</VirtualHost>
